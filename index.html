function kpi(x,w,l,v,r){return '<div class="kpi" style="left:'+x+'px;width:'+w+'px"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="r">'+r+'</div></div>'}
const kpis=list=>{const n=list.length,w=(1232-(n-1)*12)/n;return list.map((k,i)=>kpi(24+i*(w+12),w,...k)).join('')};
const dl=(d,suf='pp')=>{const c=d>0.049?'up':d<-0.049?'dn':'neu';return '<span class="'+c+'">'+(d>0.049?'▲ ':d<-0.049?'▼ ':'')+Math.abs(d).toFixed(1)+' '+suf+'</span>'};
const empty=(t,d)=>'<div class="empty"><i><svg width="12" height="14" viewBox="0 0 10 14" aria-hidden="true"><path d="M0 0v12l3.2-3 2.4 5 2-1-2.4-4.8 4.3-.2z" fill="#2C68C7"/></svg></i><b>'+t+'</b><span>'+d+'</span></div>';

/* ---------------- charts ---------------- */
function lineChart(o){// o:{w,h,x0,x1,top,bot,months,series:[{vals,color,w,label}],ymin,ymax,ticks,fmt,target,events,tipFor,bold,ring}
 const {w,h,x0,x1,top,bot,months}=o;const n=months.length,st=n>1?(x1-x0)/(n-1):0,X=i=>x0+i*st,Y=v=>bot-(v-o.ymin)/(o.ymax-o.ymin)*(bot-top);
 let g='';for(const t of o.ticks)g+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="'+(t===o.ymin?'#C5D0DE':'#EDF1F6')+'"/><text x="'+(x0-8)+'" y="'+(Y(t)+3.5)+'" font-size="10" fill="#9AA3AE" text-anchor="end">'+o.fmt(t)+'</text>';
 if(o.target!=null)g+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(o.target)+'" y2="'+Y(o.target)+'" stroke="#D64554" stroke-width="1.5" stroke-dasharray="4 3"/>';
 const evM=(o.events||[]).map(e=>e.m);
 months.forEach((m,i)=>{const b=evM.includes(m)||(o.bold||[]).includes(m);g+='<text x="'+X(i)+'" y="'+(bot+14)+'" font-size="10" text-anchor="middle" fill="'+(b?'#252423':'#9AA3AE')+'" font-weight="'+(b?700:400)+'">'+ML(m)+'</text>'});
 for(const m of uniq(evM)){const i=months.indexOf(m);if(i<0)continue;g+='<line x1="'+X(i)+'" x2="'+X(i)+'" y1="'+(top-10)+'" y2="'+bot+'" stroke="#C5D0DE" stroke-dasharray="3 3"/>'}
 for(const s of o.series){const pts=s.vals.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);if(!pts.length)continue;g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2)+'" stroke-linejoin="round" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>'+pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="'+s.color+'" stroke="#fff"/>').join('');const lp=pts[pts.length-1],lv=s.vals.filter(v=>v!=null).pop();if(s.label!==false)g+='<text x="'+(lp[0]+7)+'" y="'+(lp[1]+(s.dy||4))+'" font-size="11" font-weight="700" fill="'+s.color+'">'+o.fmt(lv,true)+'</text>'}
 for(const m of uniq(evM)){const i=months.indexOf(m);if(i<0)continue;const list=o.events.filter(e=>e.m===m);g+='<g '+tip(evTip(list,o.tipFor?o.tipFor(i,true):''))+' style="cursor:pointer"><circle cx="'+X(i)+'" cy="'+(top-16)+'" r="9" fill="transparent"/><circle cx="'+X(i)+'" cy="'+(top-16)+'" r="6" fill="#fff" stroke="#16376C" stroke-width="2"/></g>'}
 if(o.tipFor)months.forEach((m,i)=>{g+='<rect x="'+(X(i)-st/2)+'" y="'+top+'" width="'+Math.max(st,12)+'" height="'+(bot-top)+'" fill="transparent" '+tip(o.tipFor(i))+(o.click?' data-act="'+o.click+'" data-m="'+m+'" style="cursor:pointer"':'')+'/>'});
 return '<svg width="'+w+'" height="'+h+'" class="abs" style="left:0;top:0">'+g+'</svg>'}
function legend(items,x,y,anchorRight){const parts=items.map(([k,c,l])=>(k==='dot'?'<span class="dot" style="background:'+c+'"></span>':k==='ring'?'<span class="dot" style="background:#fff;box-shadow:inset 0 0 0 2px '+c+'"></span>':k==='dash'?'<span style="display:inline-block;width:14px;border-top:2px dashed '+c+';vertical-align:3px;margin-right:6px"></span>':k==='line'?'<span style="display:inline-block;width:14px;border-top:3px solid '+c+';vertical-align:3px;margin-right:6px"></span>':'<span style="display:inline-block;width:10px;height:10px;background:'+c+';margin-right:6px;vertical-align:-1px"></span>')+'<span style="color:#605E5C;margin-right:14px">'+l+'</span>').join('');return '<div class="abs" style="'+(anchorRight?'right:'+x:'left:'+x)+'px;top:'+y+'px;font-size:10px;white-space:nowrap">'+parts+'</div>'}

/* ---------------- page: overview ---------------- */
function pOverview(){const [s,e]=range();const ps=sel();const rp=refPairs(ps,s);
 let months=[];for(let m=s;m<=e;m++)months.push(m);if(S.f.agg==='Quarterly')months=months.filter(m=>[2,5,8].includes(m)||m===e||m===s);
 const rep=months.map(m=>agg(ps,m).s),ref=months.map(m=>agg(rp,m).s);const cur=agg(ps,e),rc=agg(rp,e),r0=agg(rp,s);
 const cnt=(m,key)=>uniq(ps.filter(p=>act(p,m)).map(key)).length;
 const kDom=p=>p.e.dom,kEnt=p=>p.e.id,kPar=p=>p.e.id+'|'+p.r.param,kRule=p=>p.r.id,kDim=p=>p.r.dim;
 const ar=(k)=>'<b>'+cnt(s,k)+' → '+cnt(e,k)+'</b>&nbsp; '+M[s]+' → '+M[e];
 let h=header('Data quality &amp; monitoring evolution','Tracks data quality (DQS) and monitoring coverage over time, separating real quality changes from changes in what is measured.');
 h+=fbar([['period','Analysis period'],['dom','Data domain'],['ent','Data entity'],['param','Critical parameter']]);
 h+=kpis([['Reported DQS',pc(cur.s),dl(cur.s-rc.s)+'&nbsp; vs reference'],['Reference DQS',pc(rc.s),dl(rc.s-r0.s)+'&nbsp; since '+M[s]],['Data domains',cnt(e,kDom),ar(kDom)],['Data entities',cnt(e,kEnt),ar(kEnt)],['Critical parameters',cnt(e,kPar),ar(kPar)],['Quality rules',cnt(e,kRule),ar(kRule)],['Quality dimensions',cnt(e,kDim),ar(kDim)]]);
 // quality evolution
 const ev=evFor(s,e).filter(v=>months.includes(v.m));const tg=cur.t==null?96:Math.round(cur.t*2)/2;
 const vals=[...rep,...ref].filter(v=>v!=null);const lo=Math.max(70,Math.floor((Math.min(...vals,tg)-1)/5)*5),hi=100;
 const tq=i=>'<div class="h">'+MY(months[i])+'</div><table><tr><td><span class="dot" style="background:#16376C"></span>Reported DQS</td><td class="num"><b>'+pc(rep[i])+'</b></td></tr><tr><td><span class="dot" style="background:#13A39A"></span>Reference scope</td><td class="num"><b>'+pc(ref[i])+'</b></td></tr><tr><td>Scope effect</td><td class="num">'+sg(rep[i]-ref[i])+' pp</td></tr><tr><td>Target</td><td class="num">'+tg.toFixed(1)+'%</td></tr></table>';
 h+='<div class="card" style="left:24px;top:246px;width:752px;height:242px"><div class="vt">Quality evolution</div><div class="vs">Monthly DQS · reported vs reference scope ('+M[s]+') · last snapshot of each month</div>'+legend([['dot','#16376C','Reported'],['dot','#13A39A','Reference scope'],['dash','#D64554','Target '+tg.toFixed(1).replace('.0','')+'%'],['ring','#16376C','Milestone']],16,52)+
  '<div class="abs" style="left:0;top:0;width:752px;height:242px">'+lineChart({w:752,h:242,x0:52,x1:690,top:96,bot:194,months,series:[{vals:ref,color:'#13A39A',dy:-2},{vals:rep,color:'#16376C',w:2.5,dy:10}],ymin:lo,ymax:hi,ticks:[hi,(hi+lo)/2,lo].filter((v,i,a)=>a.indexOf(v)===i),fmt:(v,end)=>end?v.toFixed(1)+'%':Math.round(v)+'%',target:tg,events:ev,tipFor:(i,short)=>short?'Reported '+pc(rep[i])+' · Reference '+pc(ref[i]):tq(i)})+'</div><div class="abs" style="left:16px;top:222px;font-size:10px;color:#605E5C">Hover a month or a milestone · '+(S.f.agg==='Quarterly'?'quarterly view · last snapshot of each quarter':'reference scope = what was monitored in '+M[s])+'</div></div>';
 // monitoring scope
 const KEY={'Data domain':kDom,'Critical parameter':kPar,'Quality rule':kRule,'Data entity':kEnt,'Quality dimension':kDim,'Country':p=>p.c}[S.f.countBy];
 h+='<div class="card" style="left:788px;top:246px;width:468px;height:242px">'+scopeCard(s,e,ps,KEY)+'</div>';
 // table (no view selector)
 h+='<div class="card" style="left:24px;top:500px;width:1232px;height:192px"><div class="vt">Scope &amp; version history</div><div class="abs" style="right:16px;top:16px;font-size:10px;color:#605E5C">Changes after '+M[s]+' 2026 · right-click a row › Drill through</div>'+histTable(s,e)+'</div>';

const PTM={Jan:'Jan',Feb:'Fev',Mar:'Mar',Apr:'Abr',May:'Mai',Jun:'Jun',Jul:'Jul',Aug:'Ago',Sep:'Set',Oct:'Out',Nov:'Nov',Dec:'Dez'};
const PEX=new Map(PTD);const PHR=PTD.slice().sort((a,b)=>b[0].length-a[0].length).map(([a,b])=>[new RegExp('(^|[^A-Za-zÀ-ÿ])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Za-zÀ-ÿ])','g'),b]);
function trs(v){const t=v.trim();if(!t||!/[A-Za-z0-9]/.test(t))return v;let r;if(PEX.has(t))r=PEX.get(t);else{r=t;for(const [re,b] of PHR)if(re.test(r)){re.lastIndex=0;r=r.replace(re,(m,p1)=>p1+b)}}
 r=r.replace(/(\d{1,2} )?\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g,(m,d,mo)=>(d||'')+(d?PTM[mo].toLowerCase():PTM[mo]));
 r=r.replace(/(\d),(?=\d{3}(?!\d))/g,'$1§').replace(/(\d)\.(\d)/g,'$1,$2').replace(/§/g,'.');return v.replace(t,r)}
function trNode(root){if(S.lang!=='pt')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)?2:1});const ns=[];while(w.nextNode())ns.push(w.currentNode);for(const n of ns){const o=n.nodeValue,r=trs(o);if(r!==o)n.nodeValue=r}}
